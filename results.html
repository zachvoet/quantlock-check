<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuantLock Live Results</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:#1b2447;color:#fff;font-family:Inter,system-ui,sans-serif;display:flex;flex-direction:column;padding:11vh 4vw 3.5vh;gap:3vh;overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:center}
h1{font-family:"Source Serif 4",Cambria,serif;font-size:5.2vh;line-height:1.05}
.live{display:flex;align-items:center;gap:10px;font-size:2.2vh;color:#aab2cc;font-weight:600}
.dot{width:1.6vh;height:1.6vh;border-radius:50%;background:#19d3c0;animation:p 1.6s infinite}
@keyframes p{50%{opacity:.3}}
.grid{flex:1;display:grid;grid-template-columns:1fr 1.5fr;gap:3vw;min-height:0}
.card{background:#232e5c;border-radius:18px;padding:3.5vh 2.5vw;display:flex;flex-direction:column;justify-content:center}
.big{font-family:"Source Serif 4",Cambria,serif;font-size:19vh;line-height:1;color:#19d3c0}
.lbl{font-size:2.6vh;color:#d9deea;margin-top:1vh}
.avg{margin-top:3vh;font-size:2.6vh;color:#d9deea}.avg b{font-size:4.4vh;color:#fff}
h2{font-size:2.8vh;font-weight:700;margin-bottom:3vh;color:#d9deea}
.row{margin-bottom:3.2vh}
.rt{display:flex;justify-content:space-between;font-size:2.8vh;font-weight:600;margin-bottom:1vh}
.bar{height:4.4vh;background:#1b2447;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;transition:width .8s}
.foot{display:flex;align-items:center;gap:16px;font-size:2.2vh;color:#aab2cc}
.foot img{height:9vh;border-radius:6px;background:#fff}
@media(prefers-reduced-motion:reduce){.dot{animation:none}.bar i{transition:none}}
</style></head><body>
<div class="top"><h1>Live results: Quantum Readiness Check</h1><div class="live"><span class="dot"></span><span id="st">Connecting…</span></div></div>
<div class="grid">
<div class="card"><div class="big" id="n">0</div><div class="lbl">people completed the check</div><div class="avg">Average score: <b id="avg">–</b> / 10</div></div>
<div class="card"><h2>Would you book a free readiness workshop?</h2>
<div class="row"><div class="rt"><span>Yes, book me in</span><span id="yv">0</span></div><div class="bar"><i id="yb" style="background:#19d3c0"></i></div></div>
<div class="row"><div class="rt"><span>Maybe later</span><span id="mv">0</span></div><div class="bar"><i id="mb" style="background:#f2b84b"></i></div></div>
<div class="row"><div class="rt"><span>No thanks</span><span id="xv">0</span></div><div class="bar"><i id="xb" style="background:#7b5cff"></i></div></div>
</div></div>
<div class="foot"><span>Not done yet? Scan the QR code on our first slide, or go to zachvoet.github.io/quantlock-check</span></div>
<script>
{
const ID="1506FNjyjMocDrIgJgcvcYt6EKNnY4sgg6ASOUtAwDGQ";
const $=id=>document.getElementById(id);
window.qlcb=function(r){
  try{
    const v=r.table.rows.map(x=>x.c&&x.c[1]?Number(x.c[1].v)||0:0);
    const [n,y,m,no,avg]=v;
    $("n").textContent=n; $("avg").textContent=n?avg:"–";
    const t=Math.max(y+m+no,1);
    [["y",y],["m",m],["x",no]].forEach(([k,val])=>{$(k+"v").textContent=val+(n?" ("+Math.round(val/t*100)+"%)":"");$(k+"b").style.width=(val/t*100)+"%";});
    $("st").textContent="Live · updated "+new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit",second:"2-digit"});
  }catch(e){$("st").textContent="Live · waiting for data";}
};
function load(){
  const s=document.createElement("script");
  s.src="https://docs.google.com/spreadsheets/d/"+ID+"/gviz/tq?tqx=responseHandler:qlcb&headers=0&range=A1:B5&t="+Date.now();
  s.onload=s.onerror=()=>s.remove();
  document.body.appendChild(s);
}
load(); setInterval(load,5000);
}
</script></body></html>
